<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Médecin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex justify-center items-center">
    <div class="container mx-auto p-4 md:p-6 lg:p-8 flex flex-col items-center">
        <h1 class="text-5xl text-blue-500 mb-8">Inscription Médecin</h1>

        <!-- Formulaire d'inscription -->
        <form action="enregistrer-medecin.php" method="POST">
            <!-- Champ Nom -->
            <div class="mb-6">
                <label for="nom" class="block text-gray-100 text-lg mb-2">Nom</label>
                <input type="text" id="nom" name="nom" placeholder="Votre nom" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Prénom -->
            <div class="mb-6">
                <label for="prenom" class="block text-gray-100 text-lg mb-2">Prénom</label>
                <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Email -->
            <div class="mb-6">
                <label for="email" class="block text-gray-100 text-lg mb-2">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="exemple@domaine.com" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Mot de passe -->
            <div class="mb-6">
                <label for="password" class="block text-gray-100 text-lg mb-2">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="********" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Spécialité -->
            <div class="mb-6">
                <label for="specialite" class="block text-gray-100 text-lg mb-2">Spécialité</label>
                <input type="text" id="specialite" name="specialite" placeholder="Votre spécialité" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Numéro de licence -->
            <div class="mb-6">
                <label for="numero_licence" class="block text-gray-100 text-lg mb-2">Numéro de licence</label>
                <input type="text" id="numero_licence" name="numero_licence" placeholder="Votre numéro de licence" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Bouton de soumission -->
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                S'inscrire
            </button>
        </form>

        
        <!-- Lien pour revenir à la page d'inscription principale -->
        <a href="index.html" class="text-blue-500 hover:text-blue-700 text-lg mt-6">
            <i class="fas fa-arrow-left mr-2"></i> Retour à la page d'inscription
        </a>
      
    </div>
</body>
</html>
