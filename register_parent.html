<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Parent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex justify-center items-center">
    <div class="container mx-auto p-4 md:p-6 lg:p-8 flex flex-col items-center">
        <h1 class="text-5xl text-blue-500 mb-8">Inscription Parent</h1>
        
        <form action="enregistrer-parent.php" method="POST" class="w-full max-w-md">
            <!-- Champ Nom complet -->
            <div class="mb-6">
                <label for="name" class="block text-gray-100 text-lg mb-2">Nom complet</label>
                <input type="text" id="name" name="name" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Email -->
            <div class="mb-6">
                <label for="email" class="block text-gray-100 text-lg mb-2">Adresse e-mail</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Champ Mot de passe -->
            <div class="mb-6">
                <label for="password" class="block text-gray-100 text-lg mb-2">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 bg-gray-700 text-gray-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Bouton de soumission -->
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mb-4">
                S'inscrire
            </button>

            <p class="text-gray-400">Vous pourrez ajouter vos enfants après l'inscription.</p>
        </form>

        <a href="register.html" class="text-blue-500 hover:text-blue-700 text-lg mt-6">
            <i class="fas fa-arrow-left mr-2"></i> Retour à la connexion
        </a>
    </div>
</body>
</html>
