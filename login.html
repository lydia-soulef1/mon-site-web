<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#333">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>

<body>

    <header class="bg-[#4A90E2] py-4">
        <div class="container mx-auto flex justify-between items-center px-4">
            <!-- Logo -->
            <div class="logo text-white text-3xl font-semibold">Vaccination Infantile</div>

            <!-- Navbar -->
            <nav class="hidden md:flex space-x-6">
                <ul class="flex space-x-6">
                    <li><a href="#accueil" class="text-white hover:text-gray-300">Accueil</a></li>
                    <li><a href="#features" class="text-white hover:text-gray-300">Fonctionnalités</a></li>
                    <li><a href="#conditions" class="text-white hover:text-gray-300">Conditions</a></li>
                    <li><a href="#importance" class="text-white hover:text-gray-300">Importance</a></li>
                    <li><a href="#vaccins" class="text-white hover:text-gray-300">Vaccin</a></li>
                    <li><a href="login.html"
                            class="bg-white text-[#4A90E2] px-4 py-2 rounded-full hover:bg-gray-100">Connexion</a></li>
                </ul>
            </nav>

            <!-- Mobile Menu Button -->
            <div class="md:hidden flex items-center">
                <button id="mobile-menu-button" class="text-white focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        class="h-6 w-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="md:hidden hidden bg-[#4A90E2] text-white py-4">
            <ul class="space-y-4 px-4">
                <li><a href="#accueil" class="block hover:text-gray-300">Accueil</a></li>
                <li><a href="#features" class="block hover:text-gray-300">Fonctionnalités</a></li>
                <li><a href="#conditions" class="block hover:text-gray-300">Conditions</a></li>
                <li><a href="#importance" class="block hover:text-gray-300">Importance</a></li>
                <li><a href="#vaccins" class="block hover:text-gray-300">Vaccin</a></li>
                <li><a href="login.html"
                        class="block bg-white text-[#4A90E2] px-4 py-2 rounded-full hover:bg-gray-100">Connexion</a>
                </li>
            </ul>
        </div>
    </header>
    <div class="bg-gray-900 text-gray-100 h-screen flex justify-center items-center">
        <div class="w-full max-w-md p-8 bg-gray-800 rounded-lg shadow-lg">
            <h2 class="text-4xl text-blue-500 font-bold mb-6 text-center">Connexion</h2>

            <form action="login.html" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">Email :</label>
                    <input type="email" name="email" required
                        class="w-full px-4 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-200 mb-1">Mot de passe :</label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-300">
                    Se connecter
                </button>
            </form>

            <p class="mt-6 text-center text-sm">
                Pas encore de compte ?
                <a href="register.html" class="text-blue-500 hover:underline">S'inscrire</a>
            </p>
        </div>
    </div>
</body>

</html>
